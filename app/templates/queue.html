{% extends "base.html" %}
{% block content %}
<h1>Queue</h1>
<form method="post" action="{{ url_for('web.scan_post') }}">
  <button type="submit">Scan</button>
</form>
<form method="post" action="{{ url_for('web.open_path') }}">
  <input name="path" placeholder="/music/.../file.flac">
  <button type="submit">Open by path</button>
</form>
{% for key, items in groups %}
  <section class="group">
    <h2>{{ key }}</h2>
    <table>
      {% for p in items %}
      <tr>
        <td>{{ p.path }}</td>
        <td class="badge {{ badge(p).lower().replace(' ', '-').replace('…', '') }}">{{ badge(p) }}</td>
      </tr>
      {% endfor %}
    </table>
  </section>
{% endfor %}
{% endblock %}
