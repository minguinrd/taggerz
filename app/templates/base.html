<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>taggerz</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('web.queue_view') }}">Queue</a>
    <a href="{{ url_for('web.settings_view') }}">Settings</a>
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flashes">
        {% for m in messages %}<li>{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="progress"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
